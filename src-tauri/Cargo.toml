[package]
name = "vilicom"
version = "0.1.0"
description = "ViliCom - Modern Cross-Platform Serial & Log Studio"
authors = ["aikoderbot <aikoderbot@mail.grokbot.com>"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "vilicom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.3"
tokio = { version = "1", features = ["full"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
log = "0.4"
